<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Pattern Master</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <div class="game-container">

    <h1>🧠 Number Pattern Master</h1>

    <p class="subtitle">
        Find the next number in the pattern!
    </p>

    <div class="game-box">
        <div class="game-info">

    <span>⭐ Score: <b id="score">0</b></span>

    <span>🏆 Level: <b id="level">1</b></span>

    <span>🔥 Streak: <b id="streak">0</b></span>

</div>
    
    

</div>   

        <h2 id="pattern">2  4  6  8  ?</h2>

        <input
            type="number"
            id="answer"
            placeholder="Enter your answer"
        >

        <button id="submitButton">Submit Answer</button>

        <p id="message"></p>

    </div>
    

</div>
<script src="script.js"></script>

   

</body>
</html>
