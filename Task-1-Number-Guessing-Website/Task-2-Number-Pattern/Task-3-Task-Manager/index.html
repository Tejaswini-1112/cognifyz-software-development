<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

    <h1>📝 Task Manager</h1>

    <p class="subtitle">
        Organize your tasks easily ✨
    </p>

    <div class="task-input">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task..."
        >

        <button id="addButton">
            Add Task
        </button>

    </div>

    <div class="stats">

        <div class="stat">
            <span>Total</span>
            <strong id="totalTasks">0</strong>
        </div>

        <div class="stat">
            <span>Completed</span>
            <strong id="completedTasks">0</strong>
        </div>

        <div class="stat">
            <span>Pending</span>
            <strong id="pendingTasks">0</strong>
        </div>

    </div>

    <ul id="taskList"></ul>

</div>
<footer>
    Built with HTML, CSS & JavaScript 💻
</footer>
    <script src="script.js"></script>
</body>

</html>
